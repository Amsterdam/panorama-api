name: Run Tests
permissions:
  contents: read
  pull-requests: write

on:
  push:
    branches:
    - features/**
  pull_request:
    branches:
    - main
    - master

jobs:
  tests:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    # Run tests for different PostGIS versions, while we migrate the db.
    strategy:
      fail-fast: false
      matrix:
        postgis-version:
          - 14-3.2
          - 17-3.5
    env:
      POSTGIS_VERSION: ${{ matrix.postgis-version }}
    steps:
    - name: Checkout
      uses: actions/checkout@v1

    - name: Start containers
      run: docker compose -f "docker-compose.yml" up database web -d --build

    - name: Run tests
      run: docker compose exec -T web ./manage.py test
    
    - name: Stop containers
      if: always()
      run: docker compose -f "docker-compose.yml" down
